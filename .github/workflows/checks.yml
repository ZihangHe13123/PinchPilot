name: Prototype checks
on:
  # A pull request is checked once, by its own event; a push runs the checks only on main.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      # The Windows runner's console encoding is cp1252; some checks print Chinese text.
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.11'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run pytest -q
      - run: uv run pinchpilot gui --demo --smoke-seconds 2
      - run: uv run pinchpilot desktop --demo --smoke-seconds 2
      - run: uv run python scripts/check_single_finger.py
      - run: uv run python scripts/check_tripod.py
      - run: uv run python scripts/check_motion_tuning.py
      - run: uv build
      # The CNN tests need PyTorch, which the default install leaves out. Last, because the
      # steps above would uninstall it again.
      - run: uv run --extra ml pytest -q tests/test_contact_models.py tests/test_contact_cv.py
